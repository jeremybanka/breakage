name: Renovate

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  discoverUpgrades:
    if: ${{ vars.RENOVATE_APP_CLIENT_ID != '' }}
    name: Discover Upgrades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PK_K6TH }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        env:
          LOG_LEVEL: debug
          RENOVATE_ALLOW_SCRIPTS: "true"
          RENOVATE_ALLOW_PLUGINS: true
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^pnpm dlx --package=vite-plus@[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)? vp migrate --no-interactive$",
            "^pnpm install --no-frozen-lockfile --ignore-scripts$",
            "^pnpm exec dprint fmt$"]
          RENOVATE_REPOSITORIES: ${{ github.repository_owner }}/${{ github.event.repository.name }}
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
