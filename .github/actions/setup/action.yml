name: Setup
description: Download and install 3rd party software.
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        version: 2026.9.18

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
