name: Setup
description: Download and install 3rd party software.
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        version: 2026.10.15

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
