packages:
  - apps/*
  - packages/*

allowBuilds:
  dprint: true
  esbuild: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Packages authored by jeremybanka are exempt at every version.
  # Keep aligned with the corresponding rule in renovate.json.
  - break-check
  - breakage
  - comline
  - takua
  - treetrunks
  - typescript@7.0.2
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"

packageExtensions:
  # https://github.com/oven-sh/bun/issues/22805
  bun-types@1.4.2:
    dependencies:
      undici-types: 8.9.0
