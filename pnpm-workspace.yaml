packages:
  - apps/*
  - packages/*
  # Current fixture packages participate in builds; frozen environments and released sources do not.
  - packages/breakage/tests/public/fixtures/npm
  - packages/breakage/tests/public/fixtures/npm/local-host
  - packages/breakage/__tests__/fixtures/npm/candidate-minimatch
  - packages/breakage/__tests__/fixtures/npm/candidate-minimatch/local-host
  - packages/breakage/__tests__/fixtures/npm/candidate-peer-ranges
  - packages/breakage/__tests__/fixtures/npm/candidate-peer-ranges/local-host
  - packages/breakage/__tests__/fixtures/npm/candidate-peer-ranges/renderer-source
  - packages/breakage/__tests__/fixtures/npm/runtime-dependencies
  - packages/breakage/__tests__/fixtures/npm/runtime-dependencies/helper
  - packages/breakage/__tests__/fixtures/npm/runtime-dependencies/local-host
  - packages/breakage/__tests__/fixtures/npm/coupled-peers
  - packages/breakage/__tests__/fixtures/npm/coupled-peers/local-host
  - packages/breakage/__tests__/fixtures/npm/coupled-peers/renderer

allowBuilds:
  dprint: true
  esbuild: true

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Permit the verified certificate security patch before the usual release-age delay.
  - dprint@0.64.1
  - "@dprint/android-arm64@0.64.1"
  - "@dprint/android-x64@0.64.1"
  - "@dprint/darwin-arm64@0.64.1"
  - "@dprint/darwin-x64@0.64.1"
  - "@dprint/freebsd-arm64@0.64.1"
  - "@dprint/freebsd-x64@0.64.1"
  - "@dprint/linux-arm64-glibc@0.64.1"
  - "@dprint/linux-arm64-musl@0.64.1"
  - "@dprint/linux-loong64-glibc@0.64.1"
  - "@dprint/linux-loong64-musl@0.64.1"
  - "@dprint/linux-ppc64-glibc@0.64.1"
  - "@dprint/linux-ppc64-musl@0.64.1"
  - "@dprint/linux-riscv64-glibc@0.64.1"
  - "@dprint/linux-riscv64-musl@0.64.1"
  - "@dprint/linux-s390x-glibc@0.64.1"
  - "@dprint/linux-x64-glibc@0.64.1"
  - "@dprint/linux-x64-musl@0.64.1"
  - "@dprint/win32-arm64@0.64.1"
  - "@dprint/win32-x64@0.64.1"
  # Packages authored by jeremybanka are exempt at every version.
  # Keep aligned with the corresponding rule in renovate.json.
  - break-check
  - breakage
  - comline
  - takua
  - treetrunks
  - typescript@7.0.2
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
verifyDepsBeforeRun: error

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    typescript: ^5.0.0 || ^6.0.0 || ^7.0.0
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
